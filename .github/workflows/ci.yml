name: CondoLogPro CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**', 'feature/**', 'fix/**']

permissions:
  contents: read

concurrency:
  group: condologpro-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality, Postgres and browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run quality
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser flows at five viewports
        run: npm run test:e2e
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: condologpro-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
