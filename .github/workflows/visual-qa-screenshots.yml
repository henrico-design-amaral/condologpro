name: Landing visual QA screenshots

on:
  push:
    branches:
      - design/landing-visual-structure-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright
          npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          npx --yes http-server dist -a 127.0.0.1 -p 4173 > /tmp/condologpro-landing.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/condologpro-landing.log
          exit 1

      - name: Capture real browser landing
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function capture(browser, name, viewport) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const errors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
            });
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            const target = 'http://127.0.0.1:4173/';
            await page.goto(target, { waitUntil: 'networkidle' });
            await page.screenshot({ path: `visual-qa/${name}.png`, fullPage: true });
            const layout = await page.evaluate(() => ({
              href: location.href,
              pathname: location.pathname,
              width: innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              height: innerHeight,
              scrollHeight: document.documentElement.scrollHeight,
              title: document.title
            }));
            const result = {
              name,
              viewport,
              layout,
              redirected: layout.pathname !== '/',
              overflowX: layout.scrollWidth > layout.width,
              errors
            };
            fs.writeFileSync(`visual-qa/${name}.json`, JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result));
            if (result.redirected || result.overflowX || errors.length) process.exitCode = 1;
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await capture(browser, 'landing-desktop-1440', { width: 1440, height: 1000 });
            await capture(browser, 'landing-mobile-390', { width: 390, height: 844 });
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: condologpro-landing-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7
