name: Apply mobile hero fix and verify

on:
  push:
    branches:
      - design/landing-visual-structure-v1

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/landing-visual-structure-v1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply isolated mobile hero override
        run: |
          if ! grep -q "Mobile hero legibility fix" src/styles/condologpro.css; then
            cat >> src/styles/condologpro.css <<'EOF'

          /* Mobile hero legibility fix */
          @media(max-width:420px){
            .hero-copy h1{max-width:100%;font-size:clamp(2.7rem,12.6vw,3.9rem);letter-spacing:-.06em}
            .hero-copy .kicker{max-width:32ch;font-size:.66rem;line-height:1.55}
          }
          EOF
          fi
          tail -n 8 src/styles/condologpro.css

      - name: Install and build
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright
          npx playwright install --with-deps chromium

      - name: Start static preview
        run: |
          npx --yes http-server dist -a 127.0.0.1 -p 4173 > /tmp/condologpro-landing.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/condologpro-landing.log
          exit 1

      - name: Verify desktop and mobile rendering
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          async function capture(browser, name, viewport) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 });
            const errors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') errors.push(`console: ${msg.text()}`);
            });
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

            const pageHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            for (let y = 0; y < pageHeight; y += Math.max(320, Math.floor(viewport.height * 0.7))) {
              await page.evaluate(value => window.scrollTo(0, value), y);
              await page.waitForTimeout(120);
            }
            await page.evaluate(() => window.scrollTo(0, 0));
            await page.waitForTimeout(180);

            const metrics = await page.evaluate(() => {
              const hero = document.querySelector('.hero-copy h1');
              const rect = hero?.getBoundingClientRect();
              const shell = document.querySelector('.hero-grid')?.getBoundingClientRect();
              return {
                pathname: location.pathname,
                width: innerWidth,
                scrollWidth: document.documentElement.scrollWidth,
                hiddenReveals: [...document.querySelectorAll('.reveal')].filter(el => getComputedStyle(el).opacity === '0').length,
                heroRight: rect?.right ?? 0,
                shellRight: shell?.right ?? innerWidth,
                heroLeft: rect?.left ?? 0,
                shellLeft: shell?.left ?? 0
              };
            });

            await page.screenshot({ path: `visual-qa/${name}.png`, fullPage: true });
            const clippedHero = metrics.heroRight > metrics.shellRight + 1 || metrics.heroLeft < metrics.shellLeft - 1;
            const result = {
              name,
              viewport,
              ...metrics,
              overflowX: metrics.scrollWidth > metrics.width,
              clippedHero,
              errors
            };
            fs.writeFileSync(`visual-qa/${name}.json`, JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result));
            if (result.pathname !== '/' || result.overflowX || result.hiddenReveals !== 0 || clippedHero || errors.length) {
              process.exitCode = 1;
            }
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await capture(browser, 'landing-desktop-1440', { width: 1440, height: 1000 });
            await capture(browser, 'landing-mobile-390', { width: 390, height: 844 });
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload verified visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: condologpro-landing-mobile-hero-final
          path: visual-qa/
          if-no-files-found: error
          retention-days: 7

      - name: Commit verified CSS and remove temporary QA workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-hero-fix.yml
          git rm .github/workflows/visual-qa-screenshots.yml
          git add src/styles/condologpro.css
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(landing): preserve mobile hero legibility"
          git push origin HEAD:design/landing-visual-structure-v1
