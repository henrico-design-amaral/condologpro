name: Validate Astro

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/**
      - fix/**
      - chore/**

permissions:
  contents: read

jobs:
  astro:
    name: Astro check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Build with diagnostics
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          echo "=== build.log tail ==="
          tail -160 build.log
          exit $status
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: condologpro-build-log
          path: build.log
