name: Deploy CondoLogPro landing to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: condologpro-hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, deploy and smoke static experience
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Astro project
        run: npm run check

      - name: Build static landing
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          test -f dist/demo/index.html

      - name: Require Hostinger deployment configuration
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_TARGET_DIR: ${{ secrets.HOSTINGER_TARGET_DIR }}
        run: |
          test -n "$HOSTINGER_HOST"
          test -n "$HOSTINGER_USERNAME"
          test -n "$HOSTINGER_PASSWORD"
          test -n "$HOSTINGER_PORT"
          test -n "$HOSTINGER_TARGET_DIR"

      - name: Install SFTP client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy dist to Hostinger via SFTP
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_TARGET_DIR: ${{ secrets.HOSTINGER_TARGET_DIR }}
        run: |
          lftp -u "$HOSTINGER_USERNAME","$HOSTINGER_PASSWORD" -p "$HOSTINGER_PORT" sftp://"$HOSTINGER_HOST" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose ./dist "$HOSTINGER_TARGET_DIR"
          bye
          EOF

      - name: Smoke public landing and live demo
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 https://condologpro.henrico.works/ -o /tmp/landing.html \
              && curl --fail --silent --show-error --location --max-time 20 https://condologpro.henrico.works/demo/ -o /tmp/demo.html \
              && grep -q "CondoLogPro" /tmp/landing.html \
              && grep -q "Demo operacional" /tmp/demo.html; then
              echo "Public smoke passed."
              exit 0
            fi
            echo "Smoke attempt $attempt failed; waiting for edge/cache propagation."
            sleep 10
          done
          echo "Public smoke failed after retries."
          exit 1
