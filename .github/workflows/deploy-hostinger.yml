name: Deploy CondoLogPro to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  HOSTINGER_HOST: 82.25.73.172
  HOSTINGER_PORT: 65002
  HOSTINGER_USER: u326975256
  HOSTINGER_TARGET: /home/u326975256/domains/henrico.works/public_html/condologpro
  HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}

jobs:
  deploy:
    name: Build and deploy CondoLogPro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build

      - name: Deploy dist to Hostinger path
        if: env.HOSTINGER_SSH_PASSWORD != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.HOSTINGER_HOST }}
          username: ${{ env.HOSTINGER_USER }}
          password: ${{ env.HOSTINGER_SSH_PASSWORD }}
          port: ${{ env.HOSTINGER_PORT }}
          source: "dist/*"
          target: ${{ env.HOSTINGER_TARGET }}
          strip_components: 1
          rm: true

      - name: Report skipped deploy
        if: env.HOSTINGER_SSH_PASSWORD == ''
        run: |
          echo "HOSTINGER_SSH_PASSWORD secret is missing. Build passed, deploy skipped."
