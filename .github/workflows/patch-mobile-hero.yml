name: Patch mobile hero typography

on:
  push:
    branches:
      - design/landing-visual-structure-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design/landing-visual-structure-v1

      - name: Append scoped mobile hero fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/styles/condologpro.css')
          source = path.read_text()
          marker = '/* Mobile hero clipping fix — visual QA 390px */'
          if marker in source:
              raise SystemExit('mobile hero fix already present')
          block = '''\n\n/* Mobile hero clipping fix — visual QA 390px */\n@media(max-width:420px){\n  .hero{overflow:hidden}\n  .hero-copy .kicker{max-width:28ch;font-size:.66rem;line-height:1.55}\n  .hero-copy h1{max-width:100%;font-size:clamp(2.85rem,14vw,4.25rem);line-height:.96;letter-spacing:-.06em;overflow-wrap:anywhere}\n}\n'''
          path.write_text(source.rstrip() + block)
          PY
          git diff --check
          git diff -- src/styles/condologpro.css

      - name: Commit product patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/condologpro.css
          git rm .github/workflows/patch-mobile-hero.yml
          git diff --cached --check
          git commit -m "fix(landing): prevent mobile hero title clipping"
          git push origin HEAD:design/landing-visual-structure-v1
